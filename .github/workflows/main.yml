name: Mirror Latest Clash Subscription URL

#on:
  #schedule:
    #- cron: '*/5 * * * *'  # 每10分钟运行一次
  #workflow_dispatch:        # 手动触发

jobs:
  mirror:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Fetch README.md from source repo
        run: |
          echo "📥 正在下载 README.md..."
          curl -s -L "https://raw.githubusercontent.com/mksshare/mksshare.github.io/refs/heads/main/README.md" > README.md
          
          # 输出文件大小和前 50 行
          echo "📄 文件大小: $(wc -c < README.md) 字节"
          echo "📋 前 50 行内容："
          head -n 50 README.md
          echo "----------------------------------------"

          # 检查是否包含关键词
          if grep -q "免费Clash订阅链接" README.md; then
            echo "✅ 找到关键词 '免费Clash订阅链接'"
          else
            echo "❌ 未找到关键词 '免费Clash订阅链接'"
            echo "🔍 完整 README.md 内容："
            cat README.md
            exit 1
          fi

      - name: Extract subscription URL after '免费Clash订阅链接'
        run: |
          # 使用 awk 精确匹配 <details> 块中的第一个 .xyz/ 链接
          SUB_URL=$(awk '
            BEGIN { found = 0; url = "" }
            /免费Clash订阅链接/ { found = 1; next }
            found && /https:/ {
              # 匹配 https://... 开头的行，并提取完整 URL（支持跨行）
              match($0, /https:\/\/[^[:space:]]+\.xyz\/[^[:space:]]+/)
              if (RSTART > 0) {
                url = substr($0, RSTART, RLENGTH)
                print url
                exit
              }
            }
          ' README.md)

          if [ -z "$SUB_URL" ]; then
            echo "❌ 未在免费Clash订阅链接'之后找到任何订阅地址"
            exit 1
          fi

          echo "🔗 找到订阅地址: $SUB_URL"
          echo "$SUB_URL" > .sub_url

      - name: Fetch raw subscription content (no decode, no parse)
        run: |
          SUB_URL=$(cat .sub_url)
          echo "📥 正在获取原始订阅内容..."

          curl -s -L "$SUB_URL" > clash-url

          if [ ! -s clash-url ]; then
            echo "❌ 订阅内容为空或请求失败"
            exit 1
          fi

          echo "✅ 原始内容已保存，前200字符预览："
          head -c 200 clash-url
          echo "..."

      - name: Commit and push clash-url
        run: |
          git config --local user.email "874868110@qq.com"
          git config --local user.name "GitHub Action"
          git add clash-url
          git commit -m "Mirror raw subscription content $(date -u)" || echo "No changes detected"
          git push origin main

      - name: Cleanup
        run: |
          rm -f README.md .sub_url

      - name: Done
        run: |
          echo "✅ 订阅内容已镜像成功！"
          echo "Clash Verge 订阅地址："
          echo "https://raw.githubusercontent.com/nillnil/mksshare-clash-mirror/refs/heads/main/clash-url"
