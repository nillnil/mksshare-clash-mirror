name: Mirror Latest Clash Subscription URL

on:
  schedule:
    - cron: '*/10 * * * *'  # 每10分钟运行一次
  workflow_dispatch:        # 手动触发

jobs:
  mirror:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Fetch README.md from source repo
        run: |
          curl -s -L "https://raw.githubusercontent.com/mksshare/mkssshare.github.io/main/README.md" > README.md

      - name: Extract subscription URL after '<details><summary>免费Clash订阅链接</summary>'
        run: |
          # 使用 awk 精确匹配 <details> 块中的第一个 .xyz/ 链接
          # 方法：使用 perl 处理多行，从“免费Clash订阅链接”之后提取第一个 .xyz/ 链接
          SUB_URL=$(perl -0777 -ne '
            if (/免费Clash订阅链接.*?(\bhttps:\/\/[^\s<>"()]+\.[^/\s<>"()]+\/[^\s<>"()]*)/s) {
              print $1;
              exit;
            }
          ' README.md)

          if [ -z "$SUB_URL" ]; then
            echo "❌ 未在免费Clash订阅链接'之后找到任何订阅地址"
            exit 1
          fi

          echo "🔗 找到订阅地址: $SUB_URL"
          echo "$SUB_URL" > .sub_url

      - name: Fetch raw subscription content (no decode, no parse)
        run: |
          SUB_URL=$(cat .sub_url)
          echo "📥 正在获取原始订阅内容..."

          curl -s -L "$SUB_URL" > clash-url.txt

          if [ ! -s clash.txt ]; then
            echo "❌ 订阅内容为空或请求失败"
            exit 1
          fi

          echo "✅ 原始内容已保存，前200字符预览："
          head -c 200 clash-url.txt
          echo "..."

      - name: Commit and push clash-url.txt
        run: |
          git config --local user.email "874868110@qq.com"
          git config --local user.name "GitHub Action"
          git add clash-url.txt
          git commit -m "Mirror raw subscription content $(date -u)" || echo "No changes detected"
          git push origin main

      - name: Cleanup
        run: |
          rm -f README.md .sub_url

      - name: Done
        run: |
          echo "✅ 订阅内容已镜像成功！"
          echo "Clash Verge 订阅地址："
          echo "https://raw.githubusercontent.com/nillnil/mksshare-clash-mirror/refs/heads/main/clash-url.txt"
