name: Mirror Latest Clash Subscription URL

on:
  schedule:
    - cron: '*/10 * * * *'  # 每10分钟运行一次
  workflow_dispatch:        # 手动触发

jobs:
  mirror:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Fetch README.md from source repo
        run: |
          curl -s -L "https://raw.githubusercontent.com/mksshare/mksshare.github.io/refs/heads/main/README.md" > README.md

      - name: Extract subscription URL after "免费Clash订阅链接"
        run: |
          # 从包含“免费Clash订阅链接”的行开始，提取第一个 .xyz/ 链接
          SUB_URL=$(awk '
            BEGIN { found = 0 }
            /免费Clash订阅链接/ { found = 1; next }
            found && /https:\/\/[^[:space:]]+\.xyz\/[^[:space:]]+/ {
              match($0, /https:\/\/[^[:space:]]+\.xyz\/[^[:space:]]+/)
              print substr($0, RSTART, RLENGTH)
              exit
            }
          ' README.md)
          
          if [ -z "$SUB_URL" ]; then
            echo "❌ 未在'免费Clash订阅链接'之后找到订阅地址"
            exit 1
          fi

          echo "🔗 找到订阅地址: $SUB_URL"
          echo "$SUB_URL" > .sub_url

      - name: Fetch raw subscription content (no decode, no parse)
        run: |
          SUB_URL=$(cat .sub_url)
          echo "📥 正在获取原始订阅内容（透传模式）..."

          # 直接下载内容，不做任何处理（保留原始 Base64 或其他格式）
          curl -s -L "$SUB_URL" > clash.txt

          # 检查是否成功获取内容
          if [ ! -s clash.txt ]; then
            echo "❌ 订阅内容为空或请求失败"
            exit 1
          fi

          echo "✅ 原始内容已保存，前200字符预览："
          head -c 200 clash.txt
          echo "..."

      - name: Commit and push clash.txt
        run: |
          git config --local user.email "874868110@qq.com"
          git config --local user.name "GitHub Action"
          git add clash.txt
          git commit -m "Mirror raw subscription content $(date -u)" || echo "No changes detected"
          git push origin main

      - name: Cleanup
        run: |
          rm -f README.md .sub_url

      - name: Done
        run: |
          echo "✅ 订阅内容已镜像成功！"
          echo "Clash Verge 订阅地址："
          echo "https://raw.githubusercontent.com/nillnil/mksshare-clash-mirror/refs/heads/main/clash.txt"
